[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anomalous_gas_extractor"
dynamic = ["version"]
description = "Development Status :: 4 - Beta"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
authors = [
    { name = "P. Kamphuis, R. Ianjamasimanana", email = "peterkamphuisastronomy@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [  'numpy>=1.14',
    'scipy',
    'astropy',
    'psutil',
    'pyyaml',
    'omegaconf>=2.2.2',
    'matplotlib',
    'future-fstrings',
    'pyFAT-astro>=1.2.0',
    'deblend_sofia_detections>=1.1.1',
    'plotbin',
    
]

[project.urls]
Homepage = "https://github.com/PeterKamphuis/anomalous_gas_extractor"

[project.scripts]
AGE = "anomalous_gas_extractor.anomalous_gas_extractor:main"

[tool.hatch.version]
path = "version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/anomalous_gas_extractor",
]
